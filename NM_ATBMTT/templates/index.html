<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DES File Encrypt/Decrypt</title>
  <style>
    * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    background-color: #ffffff;
    padding: 30px 40px;
    border-radius: 16px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    width: 400px;
    max-width: 90%;
    transition: all 0.3s ease-in-out;
}

.container:hover {
    transform: scale(1.01);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 24px;
}

label {
    display: block;
    margin-bottom: 5px;
    color: #333;
    font-weight: 600;
}

input[type="file"],
input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.3s ease-in-out;
}

input[type="file"]:focus,
input[type="text"]:focus {
    border-color: #74ebd5;
}

.buttons {
    display: flex;
    justify-content: space-between;
}

button {
    background: #74ebd5;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    width: 48%;
    transition: all 0.2s ease;
}

button:hover {
    background: #4bbdd9;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

  </style>
</head>
<body>
    <div class="container">
        <h1>DES - Mã hóa/Giải mã File</h1>
        <form action="/process" method="post" enctype="multipart/form-data">
            <label>Chọn file:</label>
            <input type="file" name="file" required><br>

            <label>Nhập mật khẩu (tùy độ dài):</label>
            <input type="text" name="key" required><br>

            <div class="buttons">
                <button type="submit" name="action" value="encrypt">Mã hóa</button>
                <button type="submit" name="action" value="decrypt">Giải mã</button>
            </div>
        </form>
    </div>
</body>
</html>
